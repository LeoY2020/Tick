name: iOS Build & Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Xcode 27.1 / iOS 27.1 SDK)
    # GitHub 官方 Xcode 27 专用镜像（预览版，自带 Xcode 27）
    runs-on: xcode-27
    env:
      PROJECT: ios/Tick.xcodeproj
      SCHEME: Tick
      # 免签名构建（CI 不配置开发者证书）
      XCARGS: >-
        CODE_SIGNING_ALLOWED=NO
        CODE_SIGN_IDENTITY=
        CODE_SIGNING_REQUIRED=NO
        CODE_SIGN_ENTITLEMENTS=
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 27.1 (iOS 27.1 SDK)
        run: |
          # iPhone Duo 需以 iOS 27.1 SDK 构建才能铺满内屏并启用垂直工具栏，
          # 故 CI 固定切换到 Xcode 27.1；镜像中没有时明确失败而不是静默降级
          XCODE_APP=$(ls -d /Applications/Xcode*27.1*.app 2>/dev/null | head -n 1 || true)
          if [ -z "$XCODE_APP" ]; then
            echo "未找到 Xcode 27.1，无法使用 iOS 27.1 SDK 构建"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          echo "使用 $(basename "$XCODE_APP")"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios || true
          xcodebuild -showsdks | grep -q "iphonesimulator27.1" || {
            echo "未检测到 iOS 27.1 SDK"; exit 1;
          }

      - name: Install xcbeautify (if missing)
        run: which xcbeautify || brew install xcbeautify

      - name: Resolve iOS Simulator
        run: |
          # 优先使用 iPhone Duo 模拟器验证折叠形态；不可用时回退到普通 iPhone
          DEVICE=$(xcrun simctl list devices available | grep -oE "iPhone Duo" | head -n 1)
          if [ -z "$DEVICE" ]; then
            DEVICE=$(xcrun simctl list devices available | grep -oE "iPhone [0-9]+ (Pro Max|Pro)?" | head -n 1)
          fi
          if [ -z "$DEVICE" ]; then
            DEVICE=$(xcrun simctl list devices available | grep -oE "iPhone [0-9]+.*" | head -n 1 | cut -d '(' -f 1 | xargs)
          fi
          if [ -z "$DEVICE" ]; then
            echo "未找到可用的 iPhone 模拟器"; exit 1
          fi
          echo "使用模拟器: $DEVICE"
          echo "DESTINATION=platform=iOS Simulator,name=$DEVICE" >> "$GITHUB_ENV"

      - name: Test (includes build)
        run: |
          set -o pipefail
          rm -rf TestResults.xcresult
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -configuration Debug \
            $XCARGS \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            test 2>&1 | xcbeautify --renderer github-actions

      - name: Archive (Release, unsigned)
        run: |
          set -o pipefail
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath build/Tick.xcarchive \
            $XCARGS \
            archive 2>&1 | xcbeautify --renderer github-actions

      - name: Package unsigned IPA
        run: |
          # 免签名 ipa：从 xcarchive 提取 .app，按 Payload 目录结构打包
          # （CI 无开发者证书，ipa 未签名；安装前需经 AltStore/Sideloadly/爱思助手等工具自签）
          mkdir -p build/Payload
          cp -R "build/Tick.xcarchive/Products/Applications/Tick.app" build/Payload/
          (cd build && zip -qry "Tick-1.0.0-beta1-unsigned.ipa" Payload)
          ls -lh build/Tick-1.0.0-beta1-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Tick-1.0.0-beta1-unsigned-ipa-${{ github.run_number }}
          path: build/Tick-1.0.0-beta1-unsigned.ipa
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: TestResults.xcresult
          retention-days: 7
